services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app
    environment:
      - MODE=dev
    # Air will be the command as defined in Dockerfile dev stage

  frontend:
    build:
      target: builder
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    ports:
      - "5173:5173"
